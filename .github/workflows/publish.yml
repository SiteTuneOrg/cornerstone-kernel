# Publishes the kernel to GitHub Packages on a tag vX.Y.Z (SPEC_RELEASE D9 in cornerstone-app).
# The tag must be the pom's version, and `deploy` runs the same coverage gate as CI first, so a
# version is never published without it. GitHub Packages refuses to republish a version: a fix is a
# new PATCH and a new tag.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Its own runner, under its own OS user: the GITHUB_TOKEN with packages: write never
    # shares a home or a ~/.m2 with the PR builds. `release` is a label only that runner
    # carries.
    runs-on: [self-hosted, linux, release]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # server-id writes a `github` server into ~/.m2/settings.xml that reads GITHUB_ACTOR and
      # GITHUB_TOKEN, the id the pom's distributionManagement names.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: github

      - name: The tag is the pom's version
        run: |
          version=$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }

      - name: Verify and deploy
        run: ./mvnw -B -ntp deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
