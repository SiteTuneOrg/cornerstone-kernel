# The same verify as ci.yml, from an EMPTY Maven home: ci.yml restores ~/.m2 from the cache,
# so it never proves that the wrapper's checksum and the plugins still download from scratch.
# Weekly and on demand.
name: Clean build

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          settings-path: ${{ runner.temp }}/m2

      - name: Verify from an empty Maven home
        run: ./mvnw -B -ntp -s "$RUNNER_TEMP/m2/settings.xml" verify -Dmaven.repo.local="$RUNNER_TEMP/m2/repository"
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/m2

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-build-reports
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/spotbugsXml.xml
            target/surefire-reports/
          if-no-files-found: ignore
