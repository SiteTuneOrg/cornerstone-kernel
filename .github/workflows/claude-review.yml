# Reviews a PR as soon as it is opened or leaves draft, so it no longer waits for the
# next scheduled run. New commits are left to the scheduled task "Revisão diária de PRs
# abertas": a review on every push re-posted the findings still open, and in app and
# server it shares the one self-hosted runner with CI. That task can also run the code,
# which this job cannot. Each side skips a head the other already reviewed.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Queued, not cancelled: a run cut short has already posted part of its comments and
# never posts the summary.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# The job token (contents: read, dies with the job), not the Claude App's write token.
# Passing it also skips the action's "workflow must match the default branch" check, so
# a PR that edits this file is reviewed by its own copy; same-repo authors already have
# the repository's secrets, so that opens nothing new.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # No drafts, no forks (a fork's code must not run with the token), and no Dependabot
    # PR — keyed on the AUTHOR, as ci.yml does, so a human push onto one stays out too.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every step of the prompt goes through gh; without it the run would be green and
      # review nothing.
      - run: gh --version
      # Already reviewed? Count only a comment first written on this head (a reply to an
      # earlier thread is a review on the head too; original_commit_id, because commit_id
      # moves to each new head) or a summary saying "head reviewed: `<sha>`" (summaries also
      # cite earlier heads), the comment carrying the review footer, and only
      # from this job or from someone with write access. The permission is asked for, not
      # read from author_association: through the job token a private org member reads
      # CONTRIBUTOR, and on a public repository anyone can comment. A failed call leaves
      # reviewed=false, so it fails toward reviewing. Decided here, so the model never reads
      # those bodies to decide; an empty home, so no planted gh config sees the token.
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
          HOME: ${{ runner.temp }}/home
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          logins=$( { gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
                        --jq '.[] | select(.in_reply_to_id == null and .original_commit_id == env.SHA and (.user.login == "github-actions[bot]" or (.body | contains("Generated by [Claude Code]")))) | .user.login'
                      gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                        --jq '.[] | select(.user.login == "github-actions[bot]" or (.body | startswith("Review of this PR"))) | select(.body | test("[Hh]ead reviewed: `" + env.SHA[0:7])) | .user.login'
                    } | sort -u )
          reviewed=false
          while IFS= read -r login; do
            case "$login" in
              "") ;;
              "github-actions[bot]") reviewed=true ;;
              *) case "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq .permission)" in
                   admin|write) reviewed=true ;;
                 esac ;;
            esac
          done <<< "$logins"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
          if [ "$reviewed" = true ]; then echo "::notice::$SHA was already reviewed; skipping."; fi
      # On a self-hosted runner this workspace is ci.yml's too, and checkout keeps its .git
      # (hooks, config) when the remote matches: start from an empty one.
      - if: steps.seen.outputs.reviewed != 'true'
        run: find . -mindepth 1 -delete
      # The head, not refs/pull/N/merge: comments are anchored to the head's line numbers.
      # persist-credentials only stops checkout's own copy: the action then rewrites origin
      # with the job token, so .git/config holds it while the job runs (hence the Read deny).
      # An empty home: checkout copies ~/.gitconfig into its own, and a planted hooksPath or
      # fsmonitor there would run during the checkout, next to the token.
      - if: steps.seen.outputs.reviewed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          HOME: ${{ runner.temp }}/home
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Pinned by SHA to a release at least 7 days old, so Dependabot's cooldown applies.
      - if: steps.seen.outputs.reviewed != 'true'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        # An empty home: an earlier job on a self-hosted runner could have planted a
        # ~/.bashrc, ~/.gitconfig or ~/.local/bin that would run next to the token.
        env:
          HOME: ${{ runner.temp }}/home
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Off: the classifier behind the buffer needs an ANTHROPIC_API_KEY this job does
          # not have, so buffering only hid refused comments in the log — and on a
          # persistent runner its fixed /tmp file replayed earlier reviews' comments.
          classify_inline_comments: false
          prompt: |
            /code-review max --comment ${{ github.event.pull_request.number }}
            Repository: ${{ github.repository }}. Head commit: ${{ github.event.pull_request.head.sha }} (pass it as commit_id on every inline comment).
            The working tree is checked out at that commit. Read the diff with `gh pr diff`; history is not available in this job.
            Before posting anything, check `gh pr view ${{ github.event.pull_request.number }} --json headRefOid`: if the head is no longer that commit, stop and post nothing (the scheduled review covers the new head).
            Comments only: never approve and never request changes. Post only the final findings; never call a comment tool to test it.
            The working tree's CLAUDE.md and .claude/ are the base branch's (the action restores them); the PR's own copies are under .claude-pr/.
            Post every PR comment as a quoted heredoc: `gh pr comment ${{ github.event.pull_request.number }} --body "$(cat <<'EOF'`, the body on the lines after it, then `EOF` alone on a line and `)"` alone on the last one. That is the whole body in one argument, and no other form is allowed: straight inside double quotes a backtick or a $ is shell syntax, and the call is refused.
            Findings on lines outside the diff go together in one such comment. In any comment body, the word git must come right after a backtick (`git`, or a code span that opens with it): anywhere else, the base branch's hook refuses the line when it also has `core.hooksPath`, or commit and an option such as `-n`, even when those are in backticks.
            When done, post one such comment that starts with "Review of this PR — head reviewed: `<the head's 7-character SHA>`." and says how many findings you posted, saying so when there were none.
          # dontAsk: anything not allowed below is refused, never handed to a classifier.
          # Reads inside the working tree need no rule; the home (empty, this run's only)
          # holds Claude Code's saved output of a large `gh pr diff`; .git/config holds the
          # job token. Only `--body` (as a quoted heredoc) is allowed for comments, so no spelling of
          # --body-file / -F can publish a local file, and only on this PR.
          claude_args: >-
            --setting-sources project,local
            --permission-mode dontAsk
            --allowedTools "Agent,Read(~/.claude/projects/**),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --body *),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Read(./.git/**)"
