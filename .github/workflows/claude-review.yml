# Reviews a PR as soon as it is opened or leaves draft, so it no longer waits for the
# next scheduled run. New commits are left to the scheduled task "Revisão diária de PRs
# abertas": a review on every push re-posted the findings still open, and on the shared
# self-hosted runner it queued in front of CI. That task can also run the code, which
# this job cannot, and it skips a head this job already summarized (see the last line
# of the prompt).
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The job token, not the Claude App's: a review only reads and comments, and the App
# token (contents: write) would sit in the checkout's git config.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # No drafts, no forks (a fork's code must not run with the token), and no Dependabot
    # PR — keyed on the AUTHOR, as ci.yml does, so a human push onto one stays out too.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The head, not refs/pull/N/merge: comments are anchored to the head's line numbers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # Pinned to a release over a week old, so Dependabot's cooldown applies to it.
      - uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The buffer is a fixed /tmp file a persistent runner never clears, so every
          # review would re-post the earlier ones; off, a refused comment comes back to Claude.
          classify_inline_comments: false
          prompt: |
            /code-review max --comment ${{ github.event.pull_request.number }}
            Repository: ${{ github.repository }}. Head commit: ${{ github.event.pull_request.head.sha }} (pass it as commit_id on every inline comment).
            Comments only: never approve and never request changes. Post only the final findings; never call a comment tool to test it.
            The working tree's CLAUDE.md and .claude/ are the base branch's (the action restores them); the PR's own copies are under .claude-pr/.
            Findings on lines outside the diff go together in one `gh pr comment`.
            When done, post one `gh pr comment` that names the head commit you reviewed and how many findings you posted, saying so when there were none.
          # No user settings: on a persistent host an earlier job could have planted a hook there.
          claude_args: >-
            --setting-sources project,local
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
